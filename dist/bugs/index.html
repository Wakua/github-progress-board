<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>バグ報告 — 今日の進捗</title><link rel="stylesheet" href="/bugs/style.css"><script type="module" src="/bugs/app.mjs"></script></head>
<body><header class="topbar"><a class="brand" href="/bugs/">✓ 今日の進捗 <span>バグ報告</span></a><div class="actions" id="account" hidden><a href="/" id="progress-link" hidden>進捗管理</a><span id="person"></span></div></header>
<main>
<section id="workspace"><div class="heading"><div><h1>バグ報告</h1></div><div class="actions"><button id="refresh" class="quiet" disabled>更新</button><button id="new-report" disabled>＋ バグを報告</button></div></div>
<p id="notice" class="notice" role="status" aria-live="polite" hidden></p>
<div class="layout"><section class="card list" aria-label="報告一覧"><div class="list-head"><h2 id="list-heading">すべての報告</h2><button id="category-settings" class="quiet" type="button">カテゴリの設定 <span id="new-tags" class="new-count" hidden></span></button></div><div class="filters"><label class="search">検索<input id="search" type="search" maxlength="200" placeholder="本文のキーワード" autocomplete="off"></label><div class="filter-groups" id="filter-groups"></div></div><p id="report-count" class="meta"></p><div id="reports"></div></section><section class="card detail" id="detail" aria-label="報告詳細"><p class="empty">報告を選ぶと、本文と再現データを確認できます。</p></section></div></section>
</main>
<dialog id="report-dialog" aria-labelledby="form-title"><div class="heading"><h2 id="form-title">バグを報告</h2><button id="close-form" class="quiet" type="button">報告を閉じる</button></div><form id="report-form">
<label>報告文<textarea name="body" rows="9" required maxlength="256000" placeholder="起きたこと、再現手順"></textarea></label>
<label>発生したバージョン<input name="reportedVersion" maxlength="200"></label>
<fieldset class="kinds"><legend>種別</legend><div class="role-choice"><label><input type="radio" name="kind" value="bug" checked><span>不具合</span></label><label><input type="radio" name="kind" value="request"><span>要望</span></label><label><input type="radio" name="kind" value="question"><span>確認</span></label></div></fieldset>
<fieldset id="report-categories" class="categories" hidden><legend>カテゴリ</legend><div id="category-choices"></div></fieldset>
<label>再現データ<input name="files" type="file" multiple></label><p class="muted" id="policy"></p><div id="selected-files"></div><section id="recovered" hidden><h3>送信済みで報告に未登録のデータ</h3><div id="pending-files"></div></section>
<p id="form-error" role="alert"></p><p id="upload-progress" role="status" aria-live="polite"></p><button id="submit-report">報告を送信</button></form></dialog>
<dialog id="category-dialog" aria-labelledby="category-title"><div class="heading"><h2 id="category-title">カテゴリの設定</h2><button id="close-category" class="quiet" type="button">閉じる</button></div><form id="category-form"><div id="category-tags"></div><p id="category-error" class="error-text" role="alert"></p><button id="save-category">保存</button></form></dialog>
</body></html>
