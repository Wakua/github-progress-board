name: UI review

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ui-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ui-review:
    name: UI review gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Read the current PR and all changed files
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('node:fs');
            const pull_number = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number });
            if (pr.head.sha !== context.payload.pull_request.head.sha) {
              core.setFailed('PRの版が変わったため、最新の実行で確認する');
              return;
            }
            const changed = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number, per_page: 100
            });
            if (changed.length !== pr.changed_files) {
              core.setFailed('変更ファイル一覧が不足している');
              return;
            }
            const files = [...new Set(changed.flatMap(file => [file.filename, file.previous_filename].filter(Boolean)))];
            fs.writeFileSync('ui-review-input.json', JSON.stringify({
              body: pr.body, files, headSha: pr.head.sha,
              repository: `${context.repo.owner}/${context.repo.repo}`
            }));
      - name: Test the gate
        run: node --test tests/check-ui-review.test.mjs
      - name: Check the PR record
        run: node scripts/check-ui-review.mjs ui-review-input.json
